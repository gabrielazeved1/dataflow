[project]
name = "dataflow-processing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dataflow-common",
    "pydantic-settings>=2.0",
]

[tool.uv.sources]
dataflow-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processing"]
