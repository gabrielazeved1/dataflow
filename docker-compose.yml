services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # os outros servicos so sobem depois que o banco responde
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # 9000 é a api s3, 9001 o console web
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # roda uma vez: cria o bucket e encerra
  minio-init:
    build:
      context: ./infra/docker/minio
      dockerfile: Dockerfile.mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET};
      "
    env_file: .env

  # broker do celery. sem volume: task perdida o reconciler reenfileira
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # aplica as migrations e encerra. api, worker e beat esperam ele terminar
  db-migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    # na rede do compose o host é o nome do servico, nao localhost
    environment:
      POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./libs/dataflow_common/src:/app/libs/dataflow_common/src
    command: uv run --package dataflow-api alembic upgrade head

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    # bind mount do codigo: o --reload pega a edicao sem rebuild
    volumes:
      - ./services/api/src:/app/services/api/src
      - ./libs/dataflow_common/src:/app/libs/dataflow_common/src
    command: uv run --package dataflow-api uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: services/processing/Dockerfile
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    # o celery nao recarrega sozinho: editou o codigo, reinicia o worker
    volumes:
      - ./services/processing/src:/app/services/processing/src
      - ./libs/dataflow_common/src:/app/libs/dataflow_common/src
    # uma jvm por processo: sem limite o prefork cria um por cpu e estoura a memoria
    command: >
      uv run --package dataflow-processing celery -A processing.celery_app
      worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2}

  beat:
    build:
      context: .
      dockerfile: services/processing/Dockerfile
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - ./services/processing/src:/app/services/processing/src
      - ./libs/dataflow_common/src:/app/libs/dataflow_common/src
    # so agenda reaper e reconciler, quem executa é o worker
    command: uv run --package dataflow-processing celery -A processing.celery_app beat --loglevel=info

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    env_file: .env
    # fala so com a api, nunca direto com postgres ou minio
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./services/dashboard/src:/app/services/dashboard/src
      - ./services/dashboard/.streamlit:/app/.streamlit

# persistem no docker compose down, somem com down -v
volumes:
  postgres_data:
  minio_data:
