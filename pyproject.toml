[project]
name = "dataflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["services/api", "libs/dataflow_common"]

[tool.uv.sources]
dataflow-api = { workspace = true }

[dependency-groups]
dev = [
    "black>=24.0",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "dataflow-api",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyrefly]
search_path = [
    "libs/dataflow_common/src",
    "services/api/src",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    "services/api/src",
    "libs/dataflow_common/src",
]
